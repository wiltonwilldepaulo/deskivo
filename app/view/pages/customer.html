{% extends "layouts/main.html" %}

{% block title %}Novo Cliente{% endblock %}

{% block content %}
<h2>Cadastro de Cliente</h2>

<form id="form">
    <label>Nome:</label>
    <input type="text" name="name" required>

    <label>Email:</label>
    <input type="email" name="email" required>

    <label>Telefone:</label>
    <input type="text" name="phone">

    <label>Cidade:</label>
    <select name="city">
        <option value="">Selecione</option>
        <option value="São Paulo">São Paulo</option>
        <option value="Rio de Janeiro">Rio de Janeiro</option>
        <option value="Curitiba">Curitiba</option>
    </select>

    <label>Observações:</label>
    <textarea name="notes" rows="3"></textarea>

    <label>
        <input type="checkbox" name="active" value="true" checked style="width:auto; margin-right:6px">
        Cliente ativo
    </label>
    <br><br>

    <button type="submit">Salvar</button>
</form>

<p id="msg"></p>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const data = formToJson(e.target);

        try {
            await api.customer.insert(data);
            showMsg('msg', 'Cliente salvo com sucesso!', 'success');
            e.target.reset();
        } catch (err) {
            showMsg('msg', 'Erro: ' + err.message, 'error');
        }
    });
</script>
{% endblock %}
